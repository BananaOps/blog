name: Deploy to GitHub Pages

on:
  # Déclenchez le workflow chaque fois que vous poussez vers la branche `main`
  # Vous utilisez un nom de branche différent ? Remplacez `main` par le nom de votre branche
  push:
    branches: [ main ]
  # Vous permet d'exécuter ce workflow manuellement à partir de l'onglet Actions sur GitHub.
  workflow_dispatch:
  # Rebuild quotidien : les versions et licences des cartes projet sont lues
  # sur l'API GitHub au build, ce cron les garde à jour sans commit.
  schedule:
    - cron: '0 6 * * *'

# Autoriser cette tâche à cloner le dépôt et à créer un déploiement de page
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      - name: Install, build, and upload your site
        uses: withastro/action@v5
        with:
          path: .
          node-version: 20
        env:
          # Relève la limite de l'API GitHub de 60 à 5000 requêtes/heure
          # pendant le build (src/lib/github.ts).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
